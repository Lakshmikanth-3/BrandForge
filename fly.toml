# Fly.io app configuration for Sentry402
# Run `fly launch --no-deploy` first to create the app and get an app name,
# then replace `app = "sentry402"` below with the name Fly assigns you if different.

app = "sentry402"
primary_region = "iad"

[build]

[env]
  PORT = "4021"

[[mounts]]
  source = "sentry402_data"
  destination = "/app/data"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/livez"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
